version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: elearning_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e_learning
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: elearning_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@elearning.dev
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "8088:80"
    depends_on:
      - db